name: CI

on:
  push:
    branches: ["main", "master", "develop"]
  pull_request:
    branches: ["main", "master", "develop"]

jobs:
  lint-format:
    runs-on: ubuntu-latest
    name: Lint & Format
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: ESLint
        run: npm run lint
        continue-on-error: true

      - name: Prettier check
        run: npm run prettier:verify

  test:
    runs-on: ubuntu-latest
    name: Unit Tests
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm run test:unit -- --runInBand --passWithNoTests

      - name: Coverage
        run: npm run test:unit:coverage -- --passWithNoTests
        continue-on-error: true

  security:
    runs-on: ubuntu-latest
    name: Security
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: npm audit
        run: npm audit --production
        continue-on-error: true

  validate:
    runs-on: ubuntu-latest
    name: Full Validation
    needs: [lint-format, test, security]
    steps:
      - name: Validate
        run: echo "All checks passed!"

